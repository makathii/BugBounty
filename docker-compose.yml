services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: bugbounty-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bug_bounty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugbounty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bugbounty-backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=Backend.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-@j0md9c!fn2v3r^ro2qis1y_x-gl0-*q#+bpm^buop*exz@xl6}
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bug_bounty_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bug_bounty_db
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    networks:
      - bugbounty-network
    restart: on-failure

  # React Frontend
  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bugbounty-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true  # For hot reload in Docker
      - WATCHPACK_POLLING=true    # For hot reload in Docker
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bugbounty-network
    restart: on-failure

  # ClamAV for virus scanning
  clamav:
    image: clamav/clamav:latest
    platform: linux/amd64
    container_name: bugbounty-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - bugbounty-network
    restart: on-failure

networks:
  bugbounty-network:
    driver: bridge

volumes:
  postgres_data:
  clamav_data: