services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: bugbounty-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bug_bounty_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bugbounty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — shared cache for throttle counters and the leaderboard cache, so
  # they behave correctly with more than one backend worker.
  redis:
    image: redis:7-alpine
    container_name: bugbounty-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache only, no persistence
    networks:
      - bugbounty-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit — local SMTP server that catches every email the backend sends (verification
  # links, password resets) and shows them in a web inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: bugbounty-mailpit
    ports:
      - "8025:8025"   # web UI
    networks:
      - bugbounty-network
    restart: on-failure

  # Django backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugbounty-backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    # No bind mount — VirtioFS (Docker Desktop on macOS) causes EDEADLK on Python
    # imports from bind-mounted directories. Code is baked into the image via COPY.
    # Run `docker compose up --build` after any backend code changes.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-env
      - CELERY_BROKER_URL=${CELERY_BROKER_URL-redis://redis:6379/0}   # empty -> tasks run inline in the web process
      - REDIS_URL=${REDIS_URL-redis://redis:6379/1}   # set REDIS_URL= (empty) to use the in-process cache
      # Email: by default everything goes to the local Mailpit inbox (http://localhost:8025).
      # Override EMAIL_* in .env to use a real SMTP server (see .env.example).
      - EMAIL_BACKEND=${EMAIL_BACKEND:-smtp}
      - EMAIL_HOST=${EMAIL_HOST:-mailpit}
      - EMAIL_PORT=${EMAIL_PORT:-1025}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-no-reply@bugbounty.local}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-60}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-365}
      # Secrets & tunables come from .env (same directory, auto-loaded by
      # docker compose). Defaults here keep the stack bootable without one.
      - DJANGO_SETTINGS_MODULE=config.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bug_bounty_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-bug_bounty_db}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      # Throttle overrides (secure defaults 3/min & 2/min apply when unset)
      - LOGIN_THROTTLE_RATE=${LOGIN_THROTTLE_RATE:-3/min}
      - REGISTER_THROTTLE_RATE=${REGISTER_THROTTLE_RATE:-2/min}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    networks:
      - bugbounty-network
    restart: on-failure

  # Celery worker — runs background tasks (program stats refresh, notification emails)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugbounty-celery-worker
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    networks:
      - bugbounty-network
    restart: on-failure

  # Celery beat — scheduler for periodic tasks (daily audit-log retention). Run exactly one.
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugbounty-celery-beat
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    environment: *backend-env
    networks:
      - bugbounty-network
    restart: on-failure

  # React frontend
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugbounty-frontend
    # node_modules lives in an anonymous volume (below), which survives rebuilds and goes stale
    # when package.json changes (e.g. a new dependency). Syncing at start keeps it correct.
    command: sh -c "npm install --legacy-peer-deps --no-audit --no-fund && npm start"
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - REACT_APP_RECAPTCHA_SITE_KEY=${REACT_APP_RECAPTCHA_SITE_KEY:-}
      - CHOKIDAR_USEPOLLING=true  # For hot reload in Docker
      - WATCHPACK_POLLING=true    # For hot reload in Docker
      - NODE_OPTIONS=--openssl-legacy-provider  # Required for react-scripts 5 on Node 17+
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bugbounty-network
    restart: on-failure

  # ClamAV for virus scanning
  clamav:
    image: clamav/clamav:1.4
    platform: linux/amd64
    container_name: bugbounty-clamav
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - bugbounty-network
    restart: on-failure

networks:
  bugbounty-network:
    driver: bridge

volumes:
  postgres_data:
  clamav_data: