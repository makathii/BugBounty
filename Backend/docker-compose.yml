
services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bug_bounty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    # ClamAV needs a few minutes on first start to download virus definitions.
    # The web container will retry the socket connection, so startup order is fine.

  web:
    build: .
    container_name: django-backend
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - clamav
    environment:
      - DJANGO_SETTINGS_MODULE=Backend.settings
      - DATABASE_URL=postgres://postgres:postgres@db:5432/bug_bounty_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bug_bounty_db
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    env_file:
      - .env

    restart: on-failure

volumes:
  postgres_data:
  clamav_data:
